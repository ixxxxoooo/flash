# Flash 工程定义（XcodeGen）。修改后执行 `xcodegen generate` 重新生成 Flash.xcodeproj
name: Flash
options:
  bundleIdPrefix: com.ixxxxoooo
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
packages:
  FlashKit:
    path: Packages/FlashKit
targets:
  Flash:
    type: application
    platform: macOS
    sources:
      - path: Flash
      # 内核与 geo 数据作为文件夹引用整体拷入 Resources/Core
      - path: Resources/Core
        type: folder
        buildPhase: resources
    dependencies:
      - package: FlashKit
    preBuildScripts:
      - name: 拉取 mihomo 内核
        script: |
          "${SRCROOT}/scripts/fetch-core.sh"
        basedOnDependencyAnalysis: false
    info:
      path: Flash/Info.plist
      properties:
        CFBundleDisplayName: Flash
        CFBundleName: Flash
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "Flash 以 GPL-3.0 许可发布，内置 mihomo 内核（GPL-3.0）"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: Flash/Flash.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ixxxxoooo.flash
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
